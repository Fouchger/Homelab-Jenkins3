# Jenkins installation settings — trusted Bash configuration.
# Edit before creating containers. No passwords or private keys belong here.
JENKINS_PORT=8080
JENKINS_VERSION="25" # Empty: current LTS on first installation; preserve it on reruns.
INSTALL_TIMEZONE="Pacific/Auckland"
AGENT_USER="jenkins-agent"
AGENT_HOME="/var/lib/jenkins-agent"
# Optional controller SSH public key. Existing authorised keys are preserved.
AGENT_SSH_PUBLIC_KEY=""
