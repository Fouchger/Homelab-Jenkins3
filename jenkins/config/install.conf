# Jenkins installation settings — trusted Bash configuration.
# No passwords, private keys or tokens belong in this file.
JENKINS_PORT=8080
JENKINS_VERSION="" # Empty installs/upgrades to the current LTS, as in Jenkins2.
INSTALL_TIMEZONE="Pacific/Auckland"
# Match these IDs to the container profiles when changing the defaults.
CONTROLLER_CTID=100
AGENT_CTID=101
HOMELAB_JENKINS_URL="http://192.168.20.5:8080"
HOMELAB_GITHUB_OWNER=""
HOMELAB_GITHUB_REPOSITORY="Homelab-Jenkins3"
HOMELAB_GITHUB_BRANCH="main"
# Leave blank for this publicly readable repository. Set a credential ID only
# when switching the project to a private GitHub repository.
HOMELAB_GITHUB_CREDENTIAL_ID=""
