apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: homelab-vlan80-services
spec:
  serviceSelector:
    matchLabels:
      io.kubernetes.service.namespace: networking
      io.kubernetes.service.name: cilium-gateway-homelab-ingress
  interfaces:
    - ^ens18$
  loadBalancerIPs: true
  externalIPs: false
