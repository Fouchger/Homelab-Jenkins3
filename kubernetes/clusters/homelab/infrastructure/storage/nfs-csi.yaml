apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nfs-csi
  namespace: flux-system
spec:
  interval: 1h
  url: https://kubernetes-csi.github.io/csi-driver-nfs
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nfs-csi
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: csi-driver-nfs
      version: 4.13.5
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: nfs-csi
        namespace: flux-system
  values:
    storageClass:
      create: false
