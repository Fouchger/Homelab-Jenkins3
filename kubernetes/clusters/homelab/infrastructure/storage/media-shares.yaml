apiVersion: v1
kind: Namespace
metadata:
  name: media
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: omv-tb4a
spec:
  capacity:
    storage: 3Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
  mountOptions:
    - nfsvers=4.1
    - proto=tcp
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: 192.168.70.20#TB4a#static
    volumeAttributes:
      server: 192.168.70.20
      share: /TB4a
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omv-tb4a
  namespace: media
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: omv-tb4a
  resources:
    requests:
      storage: 3Ti
---
